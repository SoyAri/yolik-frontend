# ══════════════════════════════════════════════════════════════════════════════
# YOLIK.MX — Nginx Reverse Proxy
#
# Arquitectura:
#   yolik.mx        →  Angular SSR  (frontend:4000)
#   yolik.mx/api/*  →  Next.js API  (backend:3000)  [/api prefix stripped]
#
# SSL: descomenta el bloque HTTPS después de ejecutar certbot
# ══════════════════════════════════════════════════════════════════════════════

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Optimizaciones de red
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;  # No exponer versión de nginx

    # Tamaño máximo de body (ajustar según necesidades de subida de archivos)
    client_max_body_size 10M;

    # ── Compresión Gzip ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream angular_ssr {
        server frontend:4000;
        keepalive 32;
    }

    upstream express_backend {
        server backend:3000;
        keepalive 32;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # Servidor HTTP (puerto 80)
    # En producción con SSL: reemplazar este bloque por el redirect de abajo
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen       80;
        listen  [::]:80;
        server_name  yolik.mx www.yolik.mx;

        # Redirigir www → non-www
        if ($host = www.yolik.mx) {
            return 301 $scheme://yolik.mx$request_uri;
        }

        # ── Cabeceras de seguridad ─────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-XSS-Protection         "1; mode=block"                   always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

        # ── API: proxy a Next.js (elimina el prefijo /api) ────────────────
        # yolik.mx/api/productos  →  backend:3000/productos
        location /api/ {
            proxy_pass          http://express_backend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade             $http_upgrade;
            proxy_set_header    Connection          "upgrade";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Forwarded-Host    $host;
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_cache_bypass  $http_upgrade;
        }

        # ── Frontend: proxy a Angular SSR ─────────────────────────────────
        # El servidor Express de Angular sirve tanto el HTML renderizado
        # como los assets estáticos de browser/ (con cache de 1 año)
        location / {
            proxy_pass          http://angular_ssr;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade             $http_upgrade;
            proxy_set_header    Connection          "upgrade";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Forwarded-Host    $host;
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_cache_bypass  $http_upgrade;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # [FUTURO SSL] Bloque HTTPS — descomenta después de ejecutar certbot
    #
    # Pasos para activar SSL:
    #   1. Asegúrate de que el bloque HTTP de arriba sirve el webroot
    #      (necesario para el challenge ACME de certbot)
    #   2. En la VM: sudo certbot --nginx -d yolik.mx -d www.yolik.mx
    #   3. Descomenta este bloque
    #   4. Reemplaza el bloque HTTP de arriba por el redirect de debajo
    # ══════════════════════════════════════════════════════════════════════════

    # server {
    #     listen      443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name yolik.mx www.yolik.mx;
    #
    #     ssl_certificate     /etc/letsencrypt/live/yolik.mx/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yolik.mx/privkey.pem;
    #     include             /etc/letsencrypt/options-ssl-nginx.conf;
    #     ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    #
    #     # HSTS (activar solo cuando SSL esté estable)
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # (mismo contenido: cabeceras de seguridad + location /api/ + location /)
    # }

    # [FUTURO SSL] Redirect HTTP → HTTPS
    # Reemplaza el bloque server de HTTP (puerto 80) con este:
    # server {
    #     listen      80;
    #     listen [::]:80;
    #     server_name yolik.mx www.yolik.mx;
    #     return 301  https://$host$request_uri;
    # }
}
