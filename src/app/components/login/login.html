<!-- LOGIN YOLIK - Matching Store Style -->

<!-- HEADER -->
<section class="w-full h-[40vh] relative overflow-hidden bg-gradient-to-r from-[#D11C5E] to-[#E63E6D]">
  <div class="absolute inset-0 bg-black/20"></div>
  <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=2000"
       class="absolute w-full h-full object-cover opacity-40 mix-blend-overlay"
       alt="YOLIK Login">

  <div class="relative z-10 flex flex-col items-center justify-center h-full text-white px-4">
    <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter mb-4">
      Iniciar Sesión
    </h1>
    <p class="text-lg md:text-xl font-light tracking-widest uppercase">
      Bienvenido a YOLIK
    </p>
  </div>
</section>

<!-- FORMULARIO DE LOGIN -->
<section class="w-full bg-gray-50 py-12 flex-1 flex items-center justify-center px-6">
  <div class="w-full max-w-md">

    <!-- Card del formulario -->
    <div class="bg-white rounded-lg shadow-xl p-8 md:p-10">

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <!-- Email -->
        <div class="mb-6">
          <label for="email" class="block text-gray-700 font-bold mb-2 text-sm uppercase tracking-wide">
            Correo electrónico
          </label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="credentials.email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#D11C5E] focus:border-transparent transition"
            placeholder="tu@correo.com"
            required
            email>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label for="password" class="block text-gray-700 font-bold mb-2 text-sm uppercase tracking-wide">
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="credentials.password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#D11C5E] focus:border-transparent transition"
            placeholder="••••••••"
            required
            minlength="6">
        </div>

        <!-- Remember me -->
        <div class="mb-6 flex items-center justify-between">
          <a href="/recuperar-password" class="text-sm text-[#D11C5E] hover:text-[#E63E6D] font-medium transition">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading || !loginForm.form.valid"
          class="w-full bg-[#D11C5E] text-white py-3 font-bold uppercase tracking-wide rounded-lg hover:bg-[#E63E6D] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
          @if (isLoading) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Iniciando...
            </span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>

        <!-- Error Message -->
        @if (errorMessage) {
          <div class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
            <p class="text-red-600 text-sm text-center">{{ errorMessage }}</p>
          </div>
        }

      </form>

      <!-- Register Link -->
      <div class="mt-8 text-center">
        <span class="text-gray-600 text-sm">¿Aún no tienes cuenta?</span>
        <a href="/registro" class="text-[#D11C5E] hover:text-[#E63E6D] font-bold text-sm ml-2 transition">
          Regístrate aquí
        </a>
      </div>

    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="w-full py-8 bg-white border-t border-gray-200">
  <div class="px-6 text-center">
    <p class="text-gray-600 text-sm">
      © 2024 YOLIK · Moda Tradicional de Chilac, Puebla
    </p>
  </div>
</footer>
