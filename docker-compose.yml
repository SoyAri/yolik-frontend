# ══════════════════════════════════════════════════════════════════════════════
# YOLIK.MX — Docker Compose
#
# Servicios:
#   frontend  →  Angular SSR (Node, puerto interno 4000)
#   backend   →  Next.js API (Node, puerto interno 3000)
#   nginx     →  Reverse proxy público (puertos 80 / 443)
#
# Uso:
#   Desarrollo:  docker compose up --build
#   Producción:  docker compose -f docker-compose.yml up -d --build
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Angular SSR Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Variables de build-time para Angular (se hornean en el bundle)
        API_URL:                 ${API_URL:-https://yolik.mx/api}
        AUTH0_DOMAIN:            ${AUTH0_DOMAIN}
        AUTH0_CLIENT_ID:         ${AUTH0_CLIENT_ID}
        STRIPE_PUBLISHABLE_KEY:  ${STRIPE_PUBLISHABLE_KEY}
    image: yolik-frontend:latest
    container_name: yolik-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    networks:
      - yolik-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  # ── Next.js Backend ─────────────────────────────────────────────────────────
  # NOTA: ajusta el 'context' a la ruta de tu repositorio de backend.
  # El repo de Next.js debe tener su propio Dockerfile (ver comentario al final).
  # Si prefieres usar una imagen pre-publicada, reemplaza 'build' por 'image'.
  backend:
    build:
      context: ../Backend-Yolik
      dockerfile: Dockerfile
    image: yolik-backend:latest
    container_name: yolik-backend
    restart: unless-stopped
    env_file:
      - ../Backend-Yolik/.env
    expose:
      - "3000"
    networks:
      - yolik-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: yolik-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Descomenta al activar SSL con Let's Encrypt:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - certbot-webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - yolik-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Red interna ─────────────────────────────────────────────────────────────
networks:
  yolik-net:
    driver: bridge

# ── Volúmenes (activar con SSL) ──────────────────────────────────────────────
# volumes:
#   certbot-webroot:


# ══════════════════════════════════════════════════════════════════════════════
# REFERENCIA: Dockerfile mínimo para Next.js (standalone mode)
#
# Crea este archivo en la raíz de tu repo yolik-backend:
#
#   FROM node:20-alpine AS deps
#   WORKDIR /app
#   COPY package.json package-lock.json ./
#   RUN npm ci --ignore-scripts
#
#   FROM node:20-alpine AS builder
#   WORKDIR /app
#   COPY --from=deps /app/node_modules ./node_modules
#   COPY . .
#   RUN npm run build
#
#   FROM node:20-alpine AS runner
#   WORKDIR /app
#   ENV NODE_ENV=production
#   ENV PORT=3000
#   RUN addgroup --system --gid 1001 nodejs \
#    && adduser  --system --uid 1001 nextjs
#   # Requiere output: 'standalone' en next.config.js
#   COPY --from=builder /app/.next/standalone ./
#   COPY --from=builder /app/.next/static ./.next/static
#   COPY --from=builder /app/public ./public
#   USER nextjs
#   EXPOSE 3000
#   HEALTHCHECK --interval=30s --timeout=10s --start-period=40s --retries=3 \
#     CMD wget -qO- http://localhost:3000/api/health || exit 1
#   CMD ["node", "server.js"]
#
# Y agrega en next.config.js:
#   module.exports = { output: 'standalone' }
# ══════════════════════════════════════════════════════════════════════════════
